build:
  maxIssues: 0

style:
  MagicNumber:
    active: false

complexity:
  TooManyFunctions:
    # SKNode (and later SKScene/SKSpriteNode/...) mirror SpriteKit's own large per-node APIs
    # (transform properties, child management, coordinate conversion, actions, physics, touch
    # handling, ...) — a wide surface by design, not poor organization. Raised generously since
    # these classes grow across roadmap phases.
    thresholdInClasses: 30
    # SKAction's companion mirrors SpriteKit's own ~35-factory-method SKAction API 1:1 (including
    # the Phase 12 audio actions: play/pause/stop/changeVolume/changePlaybackRate/
    # playSoundFileNamed) — a deliberate, cohesive API surface, not poor organization (same
    # rationale GameplayKit-for-Android's detekt.yml documents for GKGoal's companion).
    thresholdInObjects: 35
    # SKActionExecution.kt is the frame-stepped action interpreter: one function per SKActionKind
    # composite (sequence/group/repeat) plus one apply-effect function per leaf kind.
    # SKPhysicsCollision.kt is the narrow-phase SAT/distance-test suite: one small pure function
    # per shape-pair case (circle/polygon/edge-chain × each other) plus their shared geometry
    # helpers. In both files, splitting further wouldn't reduce the function count, just scatter
    # closely related code across more files.
    thresholdInFiles: 22

naming:
  # @Composable functions are conventionally PascalCase (they're used like components), which
  # the default lowerCamelCase function-naming rule would otherwise flag.
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
