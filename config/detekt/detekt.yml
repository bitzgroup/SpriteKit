build:
  maxIssues: 0

style:
  MagicNumber:
    active: false

complexity:
  TooManyFunctions:
    # SKNode (and later SKScene/SKSpriteNode/...) mirror SpriteKit's own large per-node APIs
    # (transform properties, child management, coordinate conversion, actions, physics, touch
    # handling, ...) — a wide surface by design, not poor organization. Raised generously since
    # these classes grow across roadmap phases. SKNode carries both UIResponder callback families
    # Apple's SKNode inherits (touches* and presses*), which must stay overridable members, and
    # child-list members (addChild/insertChild/...) that need its private child list. Functions
    # that only use public API live in extension files (SKNodeHierarchy.kt, SKNodePointQueries.kt).
    thresholdInClasses: 36
    # SKAction's companion mirrors SpriteKit's own SKAction factory API 1:1 (moves, scales,
    # rotations, resizes, fades, textures, speed, audio, path-following, composition, ...) — a
    # deliberate, cohesive API surface, not poor organization (same rationale GameplayKit-for-
    # Android's detekt.yml documents for GKGoal's companion). Apple's SKAction has well over 60
    # factories and PARITY_GAP_PLAN.md is still adding the missing ones, so this is set with room
    # to grow rather than one above the current count.
    thresholdInObjects: 70
    # SKActionExecution.kt is the frame-stepped action interpreter: one function per SKActionKind
    # composite (sequence/group/repeat) plus one apply-effect function per leaf kind.
    # SKPhysicsCollision.kt is the narrow-phase SAT/distance-test suite: one small pure function
    # per shape-pair case (circle/polygon/edge-chain × each other) plus their shared geometry
    # helpers. In both files, splitting further wouldn't reduce the function count, just scatter
    # closely related code across more files.
    thresholdInFiles: 22

naming:
  # @Composable functions are conventionally PascalCase (they're used like components), which
  # the default lowerCamelCase function-naming rule would otherwise flag.
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
