org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# AGP 9's built-in Kotlin support conflicts with the standalone org.jetbrains.kotlin.android
# plugin this project still uses ("Cannot add extension with name 'kotlin'"). Opt out until
# migrating to the built-in integration is a deliberate, separate change.
android.builtInKotlin=false
# AGP 9's new internal DSL class hierarchy isn't BaseExtension-castable, which the
# org.jetbrains.kotlin.android plugin still expects (ClassCastException). Opt out for the same
# reason as android.builtInKotlin above.
android.newDsl=false

GROUP=jp.co.bitz.spritekit
VERSION_NAME=0.1.0
